[project]
name = "production-grade-rag"
version = "0.1.0"
description = "Local production-style RAG: ingest, Weaviate hybrid search, and cross-encoder reranking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-community==0.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.0.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
    "weaviate-client>=4.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
